[mgr]
prepend_keymap = [

 # --- Navigation ---
 { on = "h",       run = 'leave',             desc = "Go to the parent directory"},
 { on = "<Left>",  run = 'leave',             desc = "Go to the parent directory"},
 { on = "l",       run = 'plugin smart-enter', desc = "Enter the child directory, or open the file"},
 { on = "<Right>", run = 'plugin smart-enter', desc = "Enter the child directory, or open the file"},
 { on = ["g","g"], run = 'arrow top',         desc = "Go to top"},
 { on = "G",       run = 'arrow bot',         desc = "Go to bottom"},
 { on = "<Home>",  run = 'arrow top',         desc = "Go to top"},
 { on = "<End>",   run = 'arrow bot',         desc = "Go to bottom"},

 # --- History ---
 { on = "<Backspace>",   run = 'back',    desc = "Back to previous directory"},
 { on = "<S-Backspace>", run = 'forward', desc = "Forward to next directory"},

 # --- Preview seek ---
 { on = "<S-Up>",   run = 'seek -5',     desc = "Seek up 5 units in the preview"},
 { on = "<S-Down>", run = 'seek 5',      desc = "Seek down 5 units in the preview"},
 { on = "<S-Home>", run = 'seek -10000', desc = "Seek to preview top"},
 { on = "<S-End>",  run = 'seek 10000',  desc = "Seek to preview bottom"},

 # --- Shell ---
 { on = "!", run = 'shell "pwsh.exe -noprofile -nologo -noexit -command ""function qq{exit}"" " --block', desc = "Open PowerShell here (no profile)"},
 { on = "@", run = 'shell "pwsh.exe -nologo " --block',                                                    desc = "Open PowerShell here"},

 # --- Open with (prefix: O) ---
 { on = ["O","o"], run = 'open --interactive',          desc = "Open with... (chooser)"},
 { on = ["O","e"], run = 'shell --block  -- nvim "%h"', desc = "Open in nvim"},
 { on = ["O","c"], run = 'shell --orphan -- code "%h"', desc = "Open in VSCode"},
 { on = ["O","r"], run = 'plugin reveal',               desc = "Reveal in file manager"},

 # --- Execute (prefix: e) ---
 { on = ["e","d"], run = 'plugin diff',  desc = "Diff the selected with the hovered file"},
 { on = ["e","c"], for = "unix", run = 'plugin chmod', desc = "Chmod on selected files"},

 # --- Selection ---
 { on = "<C-o>", run = 'plugin visual-pivot', desc = "Move cursor to the other end of the selection"},

 # --- Linemode ---
 { on = ["m","c"], run = 'linemode combo', desc = "Linemode: Combo"},

 # --- Goto (prefix: g) ---
 { on = ["g","a","r"], for = "windows", run = 'cd %APPDATA%',            desc = "Go to AppData (Roaming)"},
 { on = ["g","a","l"], for = "windows", run = 'cd %LOCALAPPDATA%',       desc = "Go to AppData (Local)"},
 { on = ["g","p"],     for = "windows", run = 'cd %PROGRAMFILES%',       desc = "Go to Program Files"},
 { on = ["g","c","y"], for = "windows", run = 'cd %APPDATA%/yazi/config', desc = "Go to Yazi config"},
 { on = ["g","c","y"], for = "unix",    run = 'cd ~/.config/yazi',       desc = "Go to Yazi config"},
 { on = ["g","l"], for = "windows", run = 'plugin follow-link', desc = "Go to junction target"},

 # --- Quit ---
 { on = ["q","q"], run = 'quit',              desc = "Quit the process"},
 { on = ["q","Q"], run = 'quit --no-cwd-file', desc = "Quit without outputting cwd-file"},
 { on = ["q","w"], run = 'close',             desc = "Close the current tab, or quit if it's last"},

]
