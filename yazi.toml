"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"
[mgr]
show_hidden = true
ratio = [1,4,4]
show_symlink = true
title_format = "{cwd}"
linemode = "combo"

[preview]
tab_size = 2
image_filter = "triangle"
image_delay = 0
max_width = 1300
max_height = 1300
image_quality = 75

[opener]
npp = [
	{ run ='"C:\Program Files\Notepad++\notepad++.exe" %@', orphan = true, for = 'windows', desc = "Notepad++"}
]

micro = [
	{ run = '"micro" %@', block = true, for = 'windows', desc = 'Micro'}
]

7zip = [
	{ run = "7zFM.exe %@", orphan = true, for = 'windows', desc = 'Open in 7zip'}
]

[open]
prepend_rules = [
	{ mime = 'inode/directory', use = ["open","code"]},
	{ mime = 'inode/empty', use = ["micro","npp"]},
	{ mime = 'text/*', use = ["micro","npp"]},
	{ mime = '*/htm*', use = ["open","reveal"]},
	{ name = '*.{ini,lua}', use = ["micro","npp"]},
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "7zip", "extract", "reveal" ] },
	{ name = "*.{zip,rar,7z*,tar*,gzip,xz,zstd,bzip*,ms-cab*,cab*}", use = [ "7zip", "extract", "reveal" ] },
]
append_rules = [
]

[plugin]
prepend_previewers= [
	{ name = "*.csv", run = "rich-preview"}, # for csv files
	{ name = "*.md", run = "rich-preview" }, # for markdown (.md) files
	{ name = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
	{ name = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
	{ name = "*.json", run = "rich-preview"}, # for json (.json) files
	{ name = "*.ini", run='preview'},
	{ mime = "*.{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,ms-cab*,cab*}", run = "archive"},
	{ mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    { mime = "application/postscript", run = "mediainfo" },
	{ name = "*.md", run = 'mdcat'},
	
]
append_previewers= [
	{ name = "*", run = 'hexyl'}
]

prepend_preloaders = [  
	{ mime = "{audio,video,image}/*", run = "mediainfo" },
	{ mime = "application/subrip", run = "mediainfo" },
	{ mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    { mime = "application/postscript", run = "mediainfo" },
]

prepend_fetchers=[
	{ id = "git", name = "*", run = "git" },
	{ id = "git", name = "*/", run = "git" },
]
